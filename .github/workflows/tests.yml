# CI: runs the repo's only automated gate (see CLAUDE.md) on every push/PR.
# The suite is unit tests only — the shared StrategyForge scheme already skips
# the UITests target in its TestAction, so `xcodebuild test` stays fast.
#
# Notes for reliability:
# - MACOSX_DEPLOYMENT_TARGET is 26.5 (project.pbxproj), so the Coral.app test
#   host only LAUNCHES on macOS 26.5+. If the `macos-26` image is unavailable
#   for this account, either lower the deployment target (README claims
#   macOS 14+) or point `runs-on` at a self-hosted Mac.
# - Signing is disabled: the runner has no Developer ID cert, and the app's
#   iCloud / Sign in with Apple entitlements would otherwise demand a
#   provisioning profile. Unit tests never touch CloudKit for real (the
#   CloudKit-related tests construct CKError locally), so an unsigned test
#   host is fine.
name: tests

on:
  # Re-enabled once the repo went public — GitHub Actions is free for public repos, so
  # the cost concern that paused this is gone. This suite is the CLAUDE.md gate.
  #
  # paths-ignore: docs/branding-only pushes don't need a macOS run — nothing the
  # test suite compiles or reads lives there (~1 in 4 recent commits were
  # docs-only, so this trims ~25% of runs). Assets.xcassets is NOT ignored: it
  # ships in the app bundle the tests build.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Branding/**'
      - 'LICENSE'
      - '.gitignore'
      - 'windows/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Branding/**'
      - 'LICENSE'
      - '.gitignore'
      - 'windows/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    # Healthy runs finish in ~2.5–4.5 min wall clock; 15 gives 3× headroom over
    # the slowest observed run while capping a hung test at 15 macOS minutes
    # instead of 60 (macOS bills at 10× the Linux rate on private plans).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the image
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          sw_vers
          xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          FORMAT=cat
          command -v xcbeautify >/dev/null 2>&1 && FORMAT=xcbeautify
          # COMPILER_INDEX_STORE_ENABLE=NO skips index-store generation (useless
          # on a throwaway runner, shaves compile time). ONLY_ACTIVE_ARCH=YES
          # builds just the runner's arch instead of a universal binary.
          xcodebuild test \
            -project StrategyForge.xcodeproj \
            -scheme StrategyForge \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            | "$FORMAT"

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          # xcresult bundles are big and only useful while the failure is being
          # debugged — 3 days instead of the 90-day default keeps Actions
          # storage near zero.
          retention-days: 3
