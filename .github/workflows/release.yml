# Release: tag → signed + notarized DMG → GitHub Release.
#
# ⚠️  UNTESTED end-to-end until you've done one workflow_dispatch dry-run on a
#     throwaway tag (see docs/RELEASE.md). The UpdateChecker in the app reads the
#     latest GitHub Release, so the DMG asset name/tag must stay stable.
#
# Trigger: push a tag like `v1.2.3` (or run manually with a version input). The
# tag drives MARKETING_VERSION so the built app and the release agree.
#
# Signing: the archive is signed with StrategyForge/StrategyForge-Direct.entitlements
# (see CODE_SIGN_ENTITLEMENTS in the Archive step), a subset that DROPS the managed
# capabilities (Sign in with Apple, iCloud, CloudKit). Those would each require a
# hand-made Developer ID provisioning profile; dropping them means the DMG signs +
# notarizes with just the 6 secrets below — no portal setup. Re-add them (and a
# profile secret) when cross-device sync ships.
#
# Runner: defaults to the GitHub-hosted `macos-26` image (GA, Apple-Silicon only,
# ships Xcode 26). To build on your own Mac instead — e.g. if the hosted image
# lags the deployment target — register a self-hosted runner and set the repo
# variable RELEASE_RUNNER to its label (Settings → Secrets and variables →
# Actions → Variables). No file edit needed. See docs/RELEASE.md § self-hosted.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_CERT_P12_BASE64  — `base64 -i DeveloperIDApplication.p12` of the
#                                    "Developer ID Application" cert + private key.
#   DEVELOPER_ID_CERT_PASSWORD    — the .p12 export password.
#   DEVELOPMENT_TEAM              — 10-char Apple Team ID (e.g. ABCDE12345).
#   NOTARY_KEY_ID                 — App Store Connect API key id (for notarytool).
#   NOTARY_ISSUER_ID              — App Store Connect issuer id.
#   NOTARY_KEY_P8_BASE64          — `base64 -i AuthKey_XXX.p8` of the API key.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.3), without the leading v'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release + upload the DMG

jobs:
  release:
    # Hosted macos-26 by default; override with the RELEASE_RUNNER repo variable
    # to point at a self-hosted Mac (e.g. 'self-hosted' or a custom label).
    runs-on: ${{ vars.RELEASE_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    env:
      SCHEME: StrategyForge
      PRODUCT_NAME: Coral
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from the tag (or the manual input)
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"   # strip the leading 'v'
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version $VER"

      - name: Select newest Xcode on the image
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      # Import the Developer ID cert into a throwaway keychain so xcodebuild can sign.
      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Set MARKETING_VERSION from the tag
        run: |
          agvtool new-marketing-version "${{ steps.v.outputs.version }}" || \
            echo "agvtool failed (project may set MARKETING_VERSION in pbxproj) — passing it to xcodebuild instead."

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project StrategyForge.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Coral.xcarchive" \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            CODE_SIGN_ENTITLEMENTS=StrategyForge/StrategyForge-Direct.entitlements \
            | (command -v xcbeautify >/dev/null 2>&1 && xcbeautify || cat)

      - name: Export a Developer ID app
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Coral.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Package a DMG
        id: dmg
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/${PRODUCT_NAME}.app"
          DMG="$RUNNER_TEMP/${PRODUCT_NAME}-${{ steps.v.outputs.version }}.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$PRODUCT_NAME" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --sign "Developer ID Application" --timestamp "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize + staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          xcrun notarytool submit "${{ steps.dmg.outputs.path }}" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "${{ steps.dmg.outputs.path }}"
          rm -f "$KEY"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Coral ${{ steps.v.outputs.version }}
          draft: true      # review the notes, then publish — UpdateChecker reads published releases
          generate_release_notes: true
          files: ${{ steps.dmg.outputs.path }}
