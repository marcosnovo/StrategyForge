<!DOCTYPE html>
<!--
  Source for og.png — the 1200×630 social card (Twitter/X, Slack, LinkedIn, Product Hunt).
  It is NOT served: it exists so the card can be regenerated instead of being a binary blob
  nobody can edit. Render it to web/og.png with any headless Chrome:

    chrome --headless --screenshot=web/og.png --window-size=1200,630 \
           --hide-scrollbars file://$PWD/web/og.source.html

  On macOS the binary is usually
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome".
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(760px 420px at 82% -6%, rgba(255,107,84,.30), transparent 62%),
      radial-gradient(620px 380px at 4% 8%, rgba(226,64,41,.16), transparent 60%),
      #F1EFEA;
    color: #1A2426;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 92px 80px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 46px; height: 46px; border-radius: 12px; }
  .brand span { font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  h1 {
    margin-top: 38px;
    font-size: 60px; line-height: 1.03; font-weight: 800; letter-spacing: -.03em;
    max-width: 950px;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(115deg, #E24029, #FF6B54 60%, #FF9A72);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { margin-top: 24px; font-size: 24px; color: #5D6A67; max-width: 900px; line-height: 1.42; }
  .chips { margin-top: 48px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #D8D4CB; background: #fff; border-radius: 999px;
    padding: 11px 20px; font-size: 19px; font-weight: 600; color: #5D6A67;
  }
  .chip.hot { border-color: rgba(255,107,84,.4); background: rgba(255,107,84,.14); color: #C33A22; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 512 512"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A6E"/><stop offset=".46" stop-color="#FF6B54"/><stop offset="1" stop-color="#F03E27"/></linearGradient></defs><rect width="512" height="512" rx="115" fill="url(#cg)"/><g transform="translate(106,106) scale(3)" fill="none" stroke="#FFF3EC" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"><path d="M50 84V60"/><path d="M50 60c0-11-17-10-21-20"/><path d="M29 40c-3-8-7-9-8-16"/><path d="M29 40c3-7 7-8 10-15"/><path d="M50 60c0-11 17-10 21-20"/><path d="M71 40c3-8 7-9 8-16"/><path d="M71 40c-3-7-7-8-10-15"/></g><g transform="translate(106,106) scale(3)" fill="#FFF3EC"><circle cx="50" cy="84" r="7.6"/><circle cx="21" cy="24" r="5.6"/><circle cx="39" cy="25" r="5.6"/><circle cx="61" cy="25" r="5.6"/><circle cx="79" cy="24" r="5.6"/></g></svg>
    <span>Coral</span>
  </div>

  <h1>Multi-agent AI teams —<br><em>yours, not rented.</em></h1>
  <p class="sub">Native macOS. Runs on the CLI subscriptions you already pay for. Independent verifier, per-line provenance, open source.</p>

  <div class="chips">
    <div class="chip hot">No metering</div>
    <div class="chip">No account</div>
    <div class="chip">Claude · Codex · Gemini</div>
    <div class="chip">Reviewer ≠ author</div>
    <div class="chip">MIT</div>
  </div>
</body>
</html>
